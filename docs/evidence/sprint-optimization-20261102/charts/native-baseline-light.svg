   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475569" x="67.968" y="338.688" transform="rotate(-0 67.968 338.688)">Sin aceptación en teléfono. Las observaciones de dos intentos no constituyen un intervalo de confianza.</text>
