appId: com.openminerals.demo.mobile
name: Operator production verification receipt and management
---
- scrollUntilVisible:
    element:
      text: ^Inventario$
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn: ^Inventario$
- scrollUntilVisible:
    element:
      text: Gramos de producción DEMO
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Gramos de producción DEMO
- eraseText
- inputText: "1"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ^Registrar producido DEMO$
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ^Registrar producido DEMO$
- assertVisible: ^Registrar producción DEMO$
- tapOn: ^Confirmar demo$
- extendedWaitUntil:
    visible: ^Producción DEMO registrada$
    timeout: 30000
- tapOn: Cerrar comprobante
- scrollUntilVisible:
    element:
      text: ^Pasar a verificación DEMO$
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ^Pasar a verificación DEMO$
- tapOn: ^Confirmar demo$
- extendedWaitUntil:
    visible: ^Verificación DEMO registrada$
    timeout: 30000
- tapOn: Cerrar comprobante
- scrollUntilVisible:
    element:
      text: ^Recibir en custodia DEMO$
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ^Recibir en custodia DEMO$
- assertVisible: ^Confirmar recepción DEMO$
- tapOn: ^Confirmar demo$
- extendedWaitUntil:
    visible: ^Recepción DEMO registrada$
    timeout: 30000
- assertVisible: ^Lote DEMO creado$
- tapOn: Cerrar comprobante

- scrollUntilVisible:
    element:
      text: ^Panel gerencial$
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn: ^Panel gerencial$
- scrollUntilVisible:
    element:
      text: ^Actividad y control$
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: ^Actividad y control$
- scrollUntilVisible:
    element:
      text: ^Gramos negociados por metal$
    direction: DOWN
    timeout: 30000
- assertVisible: ^Gramos negociados por metal$
- scrollUntilVisible:
    element:
      text: (?i)^Ver comprobante de mina:.*
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: (?i)^Ver comprobante de mina:.*
- extendedWaitUntil:
    visible: ^Comprobante$
    timeout: 30000
- assertNotVisible: ^Saldo USDT después$
- tapOn: Cerrar comprobante
