appId: com.openminerals.demo.mobile
name: 013 to 020 update preserves legacy wallet and historical snapshots
---
- launchApp
- extendedWaitUntil:
    visible: ^Actividad$
    timeout: 30000
- tapOn: ^Actividad$
- assertVisible: ^Sesión sin cuenta$
- tapOn: ^Billetera$
- extendedWaitUntil:
    visible: ^USDT 268,40$
    timeout: 30000
- tapOn: ^Metales$
# This precedes the required OTA: use quantities shared with the embedded APK,
# rather than presentation copy introduced by a later JavaScript update.
- scrollUntilVisible:
    element:
      text: ^0,000 g$
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: ^0,000 g$
- takeScreenshot: safe-upgrade-preserved
- tapOn: ^Actividad$
- scrollUntilVisible:
    element:
      text: "(?i)^Ver comprobante: Compra de oro,.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "(?i)^Ver comprobante: Compra de oro,.*"
- extendedWaitUntil:
    visible: ^Comprobante$
    timeout: 30000
- assertVisible: (?i)^Compra de oro$
- scrollUntilVisible:
    element:
      text: ^USDT 196,77$
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: ^Saldo USDT después$
- tapOn: ^Ver historial$
- scrollUntilVisible:
    element:
      text: ^Mostrando\s+3\s+de\s+3\s+operaciones registradas\.$
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ^Billetera$
- extendedWaitUntil:
    visible: ^USDT 268,40$
    timeout: 30000
