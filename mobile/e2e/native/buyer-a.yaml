appId: com.openminerals.demo.mobile
name: Buyer A login and USD200 conversion
---
- runFlow:
    file: login.yaml
- tapOn: ^Billetera$
- scrollUntilVisible:
    element:
      text: Cantidad de dinero para convertir
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Cantidad de dinero para convertir
- eraseText
- inputText: "200"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: ^Convertir en demo$
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ^Convertir en demo$
- tapOn: ^Confirmar demo$
- extendedWaitUntil:
    visible: ^Comprobante$
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ^USDT 450,00$
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Cerrar comprobante
