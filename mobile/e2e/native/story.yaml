appId: com.openminerals.demo.mobile
name: Continuous native story before credentials
---
[
  {
    "tapOn": "^Inicio$"
  },
  {
    "extendedWaitUntil": {
      "visible": "Restablecer orientación del lingote",
      "timeout": 30000
    }
  },
  {
    "swipe": {
      "start": "30%,46%",
      "end": "65%,46%",
      "duration": 600
    }
  },
  {
    "tapOn": "Restablecer orientación del lingote"
  },
  {
    "tapOn": "Ir a etapa 1: ORIGEN MINERAL"
  },
  {
    "assertVisible": "Etapa 1 de 7: ORIGEN MINERAL"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "takeScreenshot": "safe-story-1"
  },
  {
    "tapOn": "Ir a etapa 2: EXTRACCIÓN"
  },
  {
    "assertVisible": "Etapa 2 de 7: EXTRACCIÓN"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "takeScreenshot": "safe-story-2"
  },
  {
    "tapOn": "Ir a etapa 3: REFINACIÓN"
  },
  {
    "assertVisible": "Etapa 3 de 7: REFINACIÓN"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "takeScreenshot": "safe-story-3"
  },
  {
    "tapOn": "Ir a etapa 4: FORMACIÓN DEL LINGOTE"
  },
  {
    "assertVisible": "Etapa 4 de 7: FORMACIÓN DEL LINGOTE"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "takeScreenshot": "safe-story-4"
  },
  {
    "tapOn": "Ir a etapa 5: CUSTODIA VIRTUAL"
  },
  {
    "assertVisible": "Etapa 5 de 7: CUSTODIA VIRTUAL"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "takeScreenshot": "safe-story-5"
  },
  {
    "tapOn": "Ir a etapa 6: FRACCIONAMIENTO DIGITAL"
  },
  {
    "assertVisible": "Etapa 6 de 7: FRACCIONAMIENTO DIGITAL"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "takeScreenshot": "safe-story-6"
  },
  {
    "tapOn": "Ir a etapa 7: PORTAFOLIO"
  },
  {
    "assertVisible": "Etapa 7 de 7: PORTAFOLIO"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "takeScreenshot": "safe-story-7"
  },
  {
    "tapOn": "Ir a etapa 4: FORMACIÓN DEL LINGOTE"
  },
  {
    "extendedWaitUntil": {
      "visible": "Etapa 4 de 7: FORMACIÓN DEL LINGOTE",
      "timeout": 8000
    }
  },
  {
    "repeat": {
      "times": 4,
      "while": {"visible": "Etapa 4 de 7: FORMACIÓN DEL LINGOTE"},
      "commands": [{"swipe": {
        "from": {"id": "immersive-stage", "point": "80%,68%"},
        "direction": "UP",
        "duration": 800,
        "waitToSettleTimeoutMs": 500
      }}]
    }
  },
  {
    "assertNotVisible": "Etapa 4 de 7: FORMACIÓN DEL LINGOTE"
  },
  {
    "extendedWaitUntil": {
      "visible": "Etapa [5-7] de 7: .*",
      "timeout": 8000
    }
  },
  {
    "assertVisible": {"id": "immersive-stage"}
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  },
  {
    "repeat": {
      "times": 4,
      "while": {"notVisible": "Etapa 4 de 7: FORMACIÓN DEL LINGOTE"},
      "commands": [{"swipe": {
        "from": {"id": "immersive-stage", "point": "80%,42%"},
        "direction": "DOWN",
        "duration": 800,
        "waitToSettleTimeoutMs": 500
      }}]
    }
  },
  {
    "extendedWaitUntil": {
      "visible": "Etapa 4 de 7: FORMACIÓN DEL LINGOTE",
      "timeout": 8000
    }
  },
  {
    "assertVisible": {"id": "immersive-stage"}
  },
  {
    "tapOn": "Ir a etapa 1: ORIGEN MINERAL"
  },
  {
    "assertVisible": "Etapa 1 de 7: ORIGEN MINERAL"
  },
  {
    "assertVisible": "Restablecer orientación del lingote"
  }
]
