appId: com.openminerals.demo.mobile
name: Operator delivery lifecycle
---
- runFlow:
    file: login.yaml
- scrollUntilVisible:
    element:
      text: ^Entregas DEMO$
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ^Entregas DEMO$
- extendedWaitUntil:
    visible: ^Gestionar entregas demo$
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Motivo ficticio del cambio de entrega
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Motivo ficticio del cambio de entrega
- eraseText
- inputText: Paso ficticio QA sin transporte real
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "^Revisar: en preparación simulada$"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "^Revisar: en preparación simulada$"
- tapOn: ^Confirmar demo$
- extendedWaitUntil:
    visible: ^Comprobante$
    timeout: 30000
- assertNotVisible: ^Saldo USDT después$
- tapOn: Cerrar comprobante
- scrollUntilVisible:
    element:
      text: Motivo ficticio del cambio de entrega
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn: Motivo ficticio del cambio de entrega
- eraseText
- inputText: Paso ficticio QA sin transporte real
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "^Revisar: despachada en la simulación$"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "^Revisar: despachada en la simulación$"
- tapOn: ^Confirmar demo$
- extendedWaitUntil:
    visible: ^Comprobante$
    timeout: 30000
- assertNotVisible: ^Saldo USDT después$
- tapOn: Cerrar comprobante
- scrollUntilVisible:
    element:
      text: Motivo ficticio del cambio de entrega
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn: Motivo ficticio del cambio de entrega
- eraseText
- inputText: Paso ficticio QA sin transporte real
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "^Revisar: entregada en la simulación$"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "^Revisar: entregada en la simulación$"
- tapOn: ^Confirmar demo$
- extendedWaitUntil:
    visible: ^Comprobante$
    timeout: 30000
- assertNotVisible: ^Saldo USDT después$
- tapOn: Cerrar comprobante
- scrollUntilVisible:
    element:
      text: (?i)^Entregada en la simulación$
    direction: UP
    centerElement: true
    timeout: 30000
- assertVisible: (?i)^Entregada en la simulación$
