appId: com.openminerals.demo.mobile
name: Visual alternatives and immediate operations
---
[
  {
    "runFlow": {
      "when": {
        "visible": {
          "text": "Usar modo visual ligero",
          "checked": false
        }
      },
      "commands": [
        {
          "tapOn": "Usar modo visual ligero"
        }
      ]
    }
  },
  {
    "assertVisible": {
      "text": "Usar modo visual ligero",
      "checked": true
    }
  },
  {
    "tapOn": "Usar modo visual ligero"
  },
  {
    "assertVisible": {
      "text": "Usar modo visual ligero",
      "checked": false
    }
  },
  {
    "tapOn": "Reducir movimiento del recorrido"
  },
  {
    "assertVisible": {
      "text": "Reducir movimiento del recorrido",
      "checked": true
    }
  },
  {
    "takeScreenshot": "safe-reduced-motion"
  },
  {
    "tapOn": "Saltar recorrido y continuar con la demo"
  },
  {
    "extendedWaitUntil": {
      "notVisible": "Saltar recorrido y continuar con la demo",
      "timeout": 30000
    }
  },
  {
    "scrollUntilVisible": {
      "element": {
        "text": "^Cantidad de metal en gramos$"
      },
      "direction": "DOWN",
      "centerElement": true,
      "timeout": 30000
    }
  },
  {
    "assertVisible": "^Cantidad de metal en gramos$"
  }
]
