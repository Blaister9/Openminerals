name: Android mine preview authenticated commerce
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-commerce:
    # Only the owner's reviewed sprint branch receives these separate R5 fixtures.
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/android-mine-realism-20261101'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: openminerals-mine-preview-r5-authenticated-commerce
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the exact R5 APK pinned for comparative performance
        run: node mobile/e2e/mine-preview-commerce.mjs download
      - name: Require fresh private R5 fixtures and PostgreSQL without resetting data
        env:
          OPENMINERALS_MINE_R5_QA_BUYER_A_ALIAS: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_A_ALIAS }}
          OPENMINERALS_MINE_R5_QA_BUYER_A_PASSWORD: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_A_PASSWORD }}
          OPENMINERALS_MINE_R5_QA_BUYER_B_ALIAS: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_B_ALIAS }}
          OPENMINERALS_MINE_R5_QA_BUYER_B_PASSWORD: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_B_PASSWORD }}
          OPENMINERALS_MINE_R5_QA_OPERATOR_ALIAS: ${{ secrets.OPENMINERALS_MINE_R5_QA_OPERATOR_ALIAS }}
          OPENMINERALS_MINE_R5_QA_OPERATOR_PASSWORD: ${{ secrets.OPENMINERALS_MINE_R5_QA_OPERATOR_PASSWORD }}
        run: node mobile/e2e/mine-preview-commerce.mjs preflight
      - name: Install pinned open-source Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 180 --max-filesize 400000000 \
            --output maestro.zip \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip
          echo 'a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e  maestro.zip' | sha256sum --check
          unzip -q maestro.zip -d maestro-cli
          mapfile -t maestro_bins < <(find "$RUNNER_TEMP/maestro-cli" -type f -path '*/bin/maestro')
          test "${#maestro_bins[@]}" -eq 1
          chmod +x "${maestro_bins[0]}"
          dirname "${maestro_bins[0]}" >> "$GITHUB_PATH"
          "${maestro_bins[0]}" --version > "$RUNNER_TEMP/openminerals-mine-r5-commerce/public/maestro-version.txt"
      - name: Require KVM and fixed resources on the standard disposable runner
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),os=require('node:os');
          const resource={availableCpus:os.availableParallelism(),totalMemoryMiB:Math.floor(os.totalmem()/1048576),guestCpus:4,guestMemoryMiB:4096};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/openminerals-mine-r5-commerce/public/host-resources.json',JSON.stringify(resource,null,2)+'\n');
          if(resource.availableCpus<4||resource.totalMemoryMiB<8192)process.exit(1);
          NODE
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Authenticated native trading custody deliveries mine reopen and offline retry
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 45
        env:
          OPENMINERALS_MINE_R5_QA_BUYER_A_ALIAS: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_A_ALIAS }}
          OPENMINERALS_MINE_R5_QA_BUYER_A_PASSWORD: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_A_PASSWORD }}
          OPENMINERALS_MINE_R5_QA_BUYER_B_ALIAS: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_B_ALIAS }}
          OPENMINERALS_MINE_R5_QA_BUYER_B_PASSWORD: ${{ secrets.OPENMINERALS_MINE_R5_QA_BUYER_B_PASSWORD }}
          OPENMINERALS_MINE_R5_QA_OPERATOR_ALIAS: ${{ secrets.OPENMINERALS_MINE_R5_QA_OPERATOR_ALIAS }}
          OPENMINERALS_MINE_R5_QA_OPERATOR_PASSWORD: ${{ secrets.OPENMINERALS_MINE_R5_QA_OPERATOR_PASSWORD }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 360
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: '"$ANDROID_HOME/emulator/emulator" -accel-check > "$RUNNER_TEMP/openminerals-mine-r5-commerce/public/acceleration.txt" 2>&1 && node mobile/e2e/mine-preview-commerce.mjs run'
      - name: Upload only sanitized native acceptance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-mine-r5-commerce-${{ github.run_id }}
          path: ${{ runner.temp }}/openminerals-mine-r5-commerce/public/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
