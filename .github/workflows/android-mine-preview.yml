name: Android mine preview comparison
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk_url:
        description: Public HTTPS APK URL for the separate 0.4.0 minepreview package
        type: string
        required: true
      apk_sha256:
        description: Exact verified lowercase SHA256 of the preview APK
        type: string
        required: true
      apk_certificate_sha256:
        description: Preview signing certificate SHA256 pinned from the inspected EAS APK
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: openminerals-isolated-native-mine-preview
  cancel-in-progress: false
jobs:
  before-after:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/android-mine-realism-20261101'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      APK_INPUT_URL: ${{ inputs.apk_url }}
      APK_INPUT_SHA256: ${{ inputs.apk_sha256 }}
      APK_INPUT_CERT_SHA256: ${{ inputs.apk_certificate_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install media inspection tools from the Ubuntu repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Verify both APK hashes certificates package runtime channel and embedded HTTPS
        run: node mobile/e2e/mine-preview.mjs download
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned open-source Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 180 --max-filesize 400000000 \
            --output maestro.zip \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.0/maestro.zip
          echo 'a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e  maestro.zip' | sha256sum --check
          unzip -q maestro.zip -d maestro-cli
          mapfile -t maestro_bins < <(find "$RUNNER_TEMP/maestro-cli" -type f -path '*/bin/maestro')
          test "${#maestro_bins[@]}" -eq 1
          chmod +x "${maestro_bins[0]}"
          dirname "${maestro_bins[0]}" >> "$GITHUB_PATH"
          "${maestro_bins[0]}" --version > "$RUNNER_TEMP/openminerals-mine-preview/public/maestro-version.txt"
      - name: Require KVM on this disposable standard public runner
        shell: bash
        run: |
          set -euo pipefail
          acceleration_log="$RUNNER_TEMP/openminerals-mine-preview/public/acceleration.txt"
          node <<'NODE'
          const fs=require('node:fs'),os=require('node:os');
          const resource={availableCpus:os.availableParallelism(),totalMemoryMiB:Math.floor(os.totalmem()/1048576),guestCpus:4,guestMemoryMiB:4096};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/openminerals-mine-preview/public/host-resources.json',JSON.stringify(resource,null,2)+'\n');
          if(resource.availableCpus<4||resource.totalMemoryMiB<8192){console.error('STANDARD_HOST_RESOURCES_INSUFFICIENT');process.exit(1);}
          NODE
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          stat -c 'KVM mode=%a uid=%u gid=%g type=%F' /dev/kvm > "$acceleration_log"
      - name: Compare presented and isolated candidate on one API29 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 40
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 360
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: '"$ANDROID_HOME/emulator/emulator" -accel-check >> "$RUNNER_TEMP/openminerals-mine-preview/public/acceleration.txt" 2>&1 && node mobile/e2e/mine-preview.mjs run'
      - name: Upload anonymous comparison evidence and sanitized summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-mine-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/openminerals-mine-preview/public/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
